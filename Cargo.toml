[package]
name = "keystroke"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["ui", "audio", "wav"] }
dirs = "7"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bevy is very slow unoptimized (and audio stutters), so optimize dependencies
# even in dev builds while keeping our own crate quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
